# markdownlint-cli configuration — https://github.com/DavidAnson/markdownlint
default: true

# Line length is not enforced; prose wraps at the author's discretion.
MD013: false

# Inline HTML is used deliberately for the README badge block and MkDocs cards.
MD033: false

# The README opens with an HTML <h1>, not a Markdown heading.
MD041: false

# Duplicate headings are legitimate under different parent sections
# (for example a repeated "### Added" per release in CHANGELOG.md).
MD024:
  siblings_only: true

# Table pipes are not aligned across rows. MD060's "aligned" style would require
# padding every cell to the width of the longest one in its column, which for the
# prose-heavy tables in the security assessment and the dependency inventory makes
# every edit a reflow of the whole table. It changes nothing about the rendered
# output.
MD060: false

# MkDocs Material nests fenced code blocks inside tabs (=== "…") and admonitions
# (!!! …) by indenting them four spaces; markdownlint reads that as an indented
# code block and reports a style mismatch that the rendered site does not have.
MD046: false
