name: Release

# Pushing a tag v<version> builds every package, signs everything, publishes a
# GitHub Release, and then publishes the crate to crates.io.
#
#   v0.1.0         a release: all of the above
#   v0.1.0-rc.1    a rehearsal: a GitHub pre-release, never marked "latest",
#                  and nothing is published to crates.io
#
# Packages built: .deb (Debian, Ubuntu), .rpm (Fedora, RHEL), .pkg.tar.zst
# (Arch), .flatpak (a bundle for any distribution), the bare binary, and the
# .crate. The tag's base version must equal the version in Cargo.toml.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          base="${TAG#v}"; base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Native packages and the bare binary are checked below; this job builds the crate.
  native:
    name: .crate
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gettext: msgfmt compiles the translations the packages install.
      - name: Install GTK development packages and gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev gettext
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build the binary and the .crate
        run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          # Binary and packages come exclusively from the verified job below.
          path: dist/*.crate
          if-no-files-found: error

  reproducible:
    name: Verify and stage the reproducible GUI binary and all package formats
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install manifest parser for unit tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Verify two clean offline builds
        run: make test-reproducible reproducible
      - name: Stage the verified binary and its reproduction inputs
        run: |
          mkdir -p dist
          cp target/reproducible/first/usbguard-gui dist/usbguard-gui
          cp target/reproducible/first/*.rpm target/reproducible/first/*.deb target/reproducible/first/*.pkg.tar.zst target/reproducible/first/*.flatpak dist/
          cp target/reproducible/report.json dist/reproducible-build.json
          cp target/reproducible/inputs/source.tar dist/reproducible-source.tar
          cp target/reproducible/inputs/recipe.tar dist/reproducible-recipe.tar
          cp target/reproducible/packages.txt dist/reproducible-packages.txt
          cp target/reproducible/toolchain.txt dist/reproducible-toolchain.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible
          path: dist/*
          if-no-files-found: error

  # Exercise the verified bundle in a sandbox; compilation/export happen above.
  flatpak:
    name: Verify the installed Flatpak bundle
    needs: [version, reproducible]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible
          path: dist
      - name: Install and exercise the verified bundle with the pinned runtime
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! dbus-run-session -- python3 scripts/verify-flatpak-runtime.py "dist/usbguard-gui-${VERSION}.flatpak" --output target/flatpak-runtime; then
            cat target/flatpak-runtime/commands.log
            exit 1
          fi
          cp target/flatpak-runtime/report.json dist/reproducible-flatpak-runtime.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-runtime
          path: dist/reproducible-flatpak-runtime.json
          if-no-files-found: error

  release:
    name: Sign and publish the GitHub Release
    needs: [native, flatpak, reproducible]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # Sigstore keyless signing via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen -o dist/sbom.json
      - name: Generate checksums
        run: make checksums

      # Keyless signing: the certificate binds each artifact to this workflow and
      # tag, so there is no long-lived private key to compromise.
      # Verification instructions live in docs/verification.md.
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          # Every line is expanded as a glob and must match at least one file:
          # a "!pattern" is not an exclusion but a literal path, and fails the
          # step. No .sigstore bundle exists yet at this point anyway.
          inputs: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a suffix (v0.1.0-rc.1) is a pre-release: GitHub never
          # marks it "latest", so the README's download links stay on the last
          # real release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # After the GitHub Release, so the packages exist even if crates.io is down;
  # the job can be re-run on its own. Never for a pre-release.
  #
  # Authentication, in order of preference:
  #   1. Trusted Publishing: set the repository variable
  #      CRATES_IO_TRUSTED_PUBLISHING=true once crates.io is configured to
  #      trust this workflow. A 30-minute token is minted per run.
  #   2. The CARGO_REGISTRY_TOKEN secret of the crates-io environment —
  #      required for the very first publish, which crates.io does not allow
  #      through Trusted Publishing.
  crates-io:
    name: Publish to crates.io
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write   # Trusted Publishing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo publish builds the packaged crate once more to verify it.
      - name: Install GTK development packages and gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev gettext
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Authenticate with Trusted Publishing
        id: auth
        if: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io credentials: set the CARGO_REGISTRY_TOKEN secret of the crates-io environment, or configure Trusted Publishing"
            exit 1
          fi
          cargo publish --locked
