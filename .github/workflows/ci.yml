name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GTK 4.14 and libadwaita 1.5 are the floor of docs/architecture.md §1.4;
      # Ubuntu 24.04 ships exactly those.
      - name: Install GTK development packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master — this action selects the toolchain from the branch name, so a
        # pinned SHA must name the toolchain explicitly via `toolchain:`.
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Translations compile, and the translated desktop and metainfo files
      # committed in data/ match po/.
      - name: Translations
        run: sudo apt-get install -y --no-install-recommends gettext && make i18n-check

  test:
    name: Tests (${{ matrix.toolchain }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV is tested explicitly so that rust-version in Cargo.toml stays honest.
        toolchain: ["stable", "beta", "1.85"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GTK 4.14 and libadwaita 1.5 are the floor of docs/architecture.md §1.4;
      # Ubuntu 24.04 ships exactly those.
      - name: Install GTK development packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test --all-features

      - name: GTK focus regression (private bus and display)
        if: matrix.toolchain == 'stable'
        env:
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: |
          sudo apt-get install -y --no-install-recommends dbus-daemon xvfb xauth
          dbus-run-session -- xvfb-run -a cargo test --all-features --lib gui_device_actions -- --ignored --test-threads=1

      # The headless commands must keep building without GTK (Cargo feature
      # `gui` off), which is also what the fuzz crate links against.
      - name: Headless build
        run: cargo build --no-default-features

  coverage:
    name: Core coverage (>90% per file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Test and enforce core coverage
        run: make coverage-core

  reproducible:
    name: Reproducible Linux GUI binary and all package formats
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install manifest parser for unit tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Test the reproducibility checker
        run: make test-reproducible
      - name: Compare two clean offline builds
        run: make reproducible
      - name: Upload comparison and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility
          path: |
            target/reproducible/report.json
            target/reproducible/SHA256SUMS
            target/reproducible/*.log
            target/reproducible/toolchain.txt
            target/reproducible/packages.txt
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Release build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GTK 4.14 and libadwaita 1.5 are the floor of docs/architecture.md §1.4;
      # Ubuntu 24.04 ships exactly those.
      - name: Install GTK development packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
