[graph]
all-features = true

[licenses]
# Check development/build dependencies and every target, including optional GUI
# crates. New license choices need explicit review against SCA_POLICY.md.
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
